<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SQL Server Performance Health Check</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f5f7fa;
            color: #222;
        }

        h1 {
            margin-bottom: 5px;
        }

        h2 {
            margin-top: 35px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 8px;
        }

        .section {
            background: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }

        pre {
            background: #f0f2f5;
            padding: 15px;
            overflow-x: auto;
            border-radius: 5px;
            white-space: pre-wrap;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: white;
        }

        th,
        td {
            border: 1px solid #cfd5dc;
            padding: 10px 12px;
            text-align: left;
            vertical-align: top;
        }

        th {
            background: #eef1f5;
            font-weight: 600;
        }

        tr:nth-child(even) {
            background: #f8f9fb;
        }

        tr:hover {
            background: #eef3f8;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 15px;
        }

        .summary-card {
            border: 1px solid #d9dee5;
            border-radius: 6px;
            padding: 15px;
            background: #fafbfc;
        }

        .summary-card span {
            display: block;
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }

        .summary-card strong {
            font-size: 20px;
        }

        .empty {
            color: #777;
            font-style: italic;
        }

    </style>

</head>

<body>

    <h1>SQL Server Performance Health Check</h1>

    <p>
        Performance assessment report generated from collected
        SQL Server evidence.
    </p>


    <div class="section">

        <h2>Executive Summary</h2>

        <div id="executive-summary"></div>

    </div>


    <div class="section">

        <h2>Environment</h2>

        <div id="environment"></div>

    </div>


    <div class="section">

        <h2>Query Performance</h2>

        <div id="query-performance"></div>

    </div>


    <div class="section">

        <h2>Wait Statistics</h2>

        <div id="wait-statistics"></div>

    </div>


    <div class="section">

        <h2>Blocking</h2>

        <div id="blocking"></div>

    </div>


    <div class="section">

        <h2>Indexes</h2>

        <div id="indexes"></div>

    </div>


    <div class="section">

        <h2>Statistics</h2>

        <div id="statistics"></div>

    </div>


    <div class="section">

        <h2>Findings</h2>

        <div id="findings"></div>

    </div>

</body>
</html>
